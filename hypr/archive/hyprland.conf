# ============================================================================
# HYPRLAND CONFIGURATION
# Wiki: https://wiki.hypr.land/Configuring/
# ============================================================================


# VARIABLES
source = ~/.config/hypr/modules/colors.conf
source = ~/.config/hypr/bool/autofloat-enabled.conf

# MONITORS
monitor = eDP-1,2880x1620@120,0x0,1.5
monitor = ,preferred,auto,1,mirror,eDP-1


# ENVIRONMENT VARIABLES
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland
env = DESKTOP_SESSION,Hyprland
env = KDE_FULL_SESSION,false

env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_USE_PORTAL,0

# NVIDIA-specific, needed for correct Wayland rendering on Nvidia GPUs
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Disables the hardware cursor plane — fixes cursor stutter on some Nvidia setups
cursor {
    no_hardware_cursors = true
}

# Render XWayland apps at native resolution instead of Hyprland's scaled output
xwayland {
    force_zero_scaling = true
}

# LAYOUTS
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1      # 0/1 toggles the built-in anime mascot wallpapers
    disable_hyprland_logo = true
    disable_splash_rendering = true

    background_color = 0xff000000

    vrr = 1   # variable refresh rate / G-Sync, where the monitor supports it
}

# Modules
 
source = ~/.config/hypr/modules/plugins.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/visual.conf
source = ~/.config/hypr/modules/input.conf
source = ~/.config/hypr/modules/windowrules.conf