exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY

exec-once = /usr/bin/awww-daemon           # wallpaper daemon
exec-once = hyprpm reload                  # reload/apply plugin manager state
exec-once = swaync                         # notification daemon
exec-once = quickshell                     # shell / bar
exec-once = hyprctl setcursor breeze_cursors 24
exec-once = kwalletd6 --kwallet6           # KDE wallet daemon
exec-once = hyprsunset --temperature 4500  # night-light style warm color temp

exec-once = wl-paste --type text --watch cliphist store -max-items 10 store