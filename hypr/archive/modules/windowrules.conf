# LAYER RULES — blur / transparency for shell components (bars, launchers, etc.)
layerrule = blur on,          match:namespace swaync-control-center
layerrule = ignore_alpha 0.4, match:namespace swaync-control-center

layerrule = blur on,          match:namespace swaync-notification-window
layerrule = ignore_alpha 0.4, match:namespace swaync-notification-window

layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha .1,  match:namespace waybar

layerrule = blur on,          match:namespace quickshell
layerrule = ignore_alpha .1,  match:namespace quickshell

layerrule = blur on,          match:namespace shell:controlpanel
layerrule = ignore_alpha 0.4, match:namespace shell:controlpanel

layerrule = order -1,         match:namespace qs_overlay   # keep overlay beneath other layers
layerrule = blur on,          match:namespace qs_overlay

layerrule = blur on,          match:namespace rofi
layerrule = ignore_alpha .1,  match:namespace rofi

layerrule = blur on,          match:namespace logout_dialog

layerrule = ignore_alpha 0.5, match:namespace ^hyprbars$

layerrule = no_anim on, match:namespace quickshell

# WINDOW RULES — GENERAL BEHAVIOR

# Cap floating window size so nothing overflows the visible screen area
windowrule = max_size 1844 993, match:float 1

windowrule {
    name = all-float
    match:class = .*
    float = $autofloatEnabled
}

windowrule {
    # Hides the hyprbars title bar on floating/hovering windows
    name = hovering-windows-buttons
    match:float = 0
    #hyprbars:no_bar = true
}

windowrule {
    # Many apps mishandle native maximize requests — ignore them globally
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # NOTE: matches every class, so this already covers CS2 — it makes the
    # dedicated "match:class cs2, immediate yes" rule below redundant
    name = cs2-tearing
    match:class = .*
    immediate = true
}

windowrule {
    # Workaround for XWayland windows misbehaving mid-drag
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# WINDOW RULES — APP-SPECIFIC
windowrule = match:class cs2, immediate yes   # tearing / immediate rendering for CS2

# windowrule = opacity 0.1 0.8, match:class ^(kitty)$   # disabled: kitty transparency experiment

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move  = 20 monitor_h-120
    float = yes
}

windowrule {
    name = transparent-windows
    match:class = ^(discord|org.telegram.desktop|spotify)$
    opacity = 0.9
}