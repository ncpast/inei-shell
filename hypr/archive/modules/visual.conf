# LOOK & FEEL — GENERAL
general {
    gaps_in  = 5
    gaps_out = 10
    border_size = 2

    #col.active_border   = rgba(c46042ee) rgba(ed7a1cee) 45deg
    col.active_border   = $accentColor $accentColor2 45deg
    col.inactive_border = rgba(595959ee)

    resize_on_border = true   # click-and-drag resize on borders/gaps
    allow_tearing    = true   # required for the per-window "immediate" rules below

    layout = dwindle
}

# LOOK & FEEL — DECORATION
decoration {
    rounding       = 15
    rounding_power = 3

    active_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled  = true
        size     = 10
        passes   = 3
        ignore_opacity = true

        noise    = 0.02
        contrast = 1.5
        vibrancy = 0.1696

        new_optimizations = true
    }
}

# LOOK & FEEL — ANIMATIONS
animations {
    enabled = yes, please :)

    #          NAME,            X0,    Y0,    X1,   Y1
    bezier = easeOutQuint,      0.23,  1,     0.32, 1
    bezier = easeInOutCubic,    0.65,  0.05,  0.36, 1
    bezier = linear,            0,     0,     1,    1
    bezier = almostLinear,      0.5,   0.5,   0.75, 1
    bezier = quick,             0.15,  0,     0.1,  1

    #           NAME,           ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,         1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     0.9,   almostLinear
    animation = fadeLayersOut, 1,     0.9,   almostLinear
    animation = workspaces,    1,     4.94,  easeOutQuint, slidevert
    animation = workspacesIn,  1,     4.21,  easeOutQuint, slidevert
    animation = workspacesOut, 1,     4.94,  easeOutQuint, slidevert
    animation = zoomFactor,    0,     7,     quick
}