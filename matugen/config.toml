[config]
#reload_apps = true

[config.reload_apps_list]
kitty = true
thunar = true

[config.wallpaper]
command = "awww img {{ image }} --transition-type fade --transition-duration 2 --transition-fps 120"
set = true

[templates.vencord]
input_path = '~/.config/matugen/templates/discord-24.css'
output_path = '~/.config/Vencord/themes/matugen-discord.css'

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -SIGUSR1 kitty"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"
post_hook   = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.quickshell]
input_path  = "~/.config/matugen/templates/Colors.qml"
output_path = "~/.config/quickshell/Theme/Colors.qml"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"
post_hook = "pkill nautilus"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/modules/colors.lua"

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.telegram]
input_path  = './templates/telegram-colors.tdesktop-theme'
output_path = '~/.cache/matugen/telegram/colors-raw.txt'
post_hook   = 'python3 "$HOME/.config/matugen/scripts/telegram_theme.py"'   # packs matugen.tdesktop-theme (colors + solid chat background)
